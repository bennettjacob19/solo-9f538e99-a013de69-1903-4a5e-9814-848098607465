services:
  planner:
    build: .
    image: cuda-mem-planner:latest
    container_name: cuda-mem-planner
    environment:
      # 单进程共享显存池容量（字节），默认 16 MiB，可按需覆盖
      POOL_SIZE_BYTES: ${POOL_SIZE_BYTES:-16777216}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
